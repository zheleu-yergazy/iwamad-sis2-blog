<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const segmentCount = 1;
      const path = window.location.pathname
        .split("/")
        .slice(0, 1 + segmentCount)
        .join("/");
      const rest = window.location.pathname.slice(path.length);
      sessionStorage.redirect = rest + window.location.search + window.location.hash;
      window.location.replace(path + "/");
    </script>
  </head>
  <body></body>
</html>
